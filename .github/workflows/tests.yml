name: tests

# Runs all four of the plugin's self-test suites on a real Windows runner:
#   lib/selftest.ps1          32 checks — the PowerShell engine against real Win32 APIs
#   lib/selftest.mjs          79 checks — the tool layer (apply/register/schema/execute)
#   lib/selftest-harness.mjs  18 checks — the DSH subprocess seam contract, via a fake seam
#   lib/occlusion-test.ps1     7 checks — occluded-window capture (PrintWindow vs CopyFromScreen)
#
# Dependency note: the plugin's peer dependencies normally ship inside DSH, which is
# not present on CI. They ARE published to npm, so CI installs them there. Only
# `@deepseek-ai/dsh-tools` matters for the code paths under test, and the suites pass
# against the published version — verified locally before this workflow was written.
#
# Scope note: this cannot prove the plugin loads inside a *running* DSH process;
# that needs a DSH install and a restart, and stays a manual step
# (see docs/COMPATIBILITY.md §5). What it does prove is that apply() registers all
# six tools with valid schemas — the part of loading checkable without booting DSH.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install the peer dependencies at the repository root so that lib/index.js
      # resolves them. Versions are pinned to what this plugin was verified against.
      - name: Install peer dependencies
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh-tools @deepseek-ai/schemastery

      # Diagnostics first: a CI runner is not a full interactive desktop, so it is
      # worth recording what the environment actually looks like when a test fails.
      - name: Describe the runner environment
        shell: pwsh
        run: |
          Write-Host "--- session / desktop facts ---"
          Write-Host ("UserInteractive : " + [Environment]::UserInteractive)
          Write-Host ("SessionId       : " + (Get-Process -Id $PID).SessionId)
          Write-Host "--- engine info action ---"
          try { ./lib/desktop-hand.ps1 -Action info } catch { Write-Host "info threw: $_" }
          Write-Host "--- engine list-windows ---"
          try { ./lib/desktop-hand.ps1 -Action list-windows } catch { Write-Host "list-windows threw: $_" }

      - name: Engine self-test
        shell: pwsh
        # Diagnostic packaging: the Actions *log* endpoint needs authentication, so
        # the output is also written to a file (artifact) and, on failure, to the
        # job summary - both readable without auth.
        #
        # ⚠️ Do NOT pipe the script into Tee-Object and then read $LASTEXITCODE.
        # In `A | B`, $LASTEXITCODE reflects B (Tee-Object), not A, so a passing
        # suite can still be reported as a failed step. That bug is why this step
        # showed 'failure' while the log plainly read "37 passed / 0 failed".
        # Run the script directly, capture its code first, and only then tee.
        run: |
          ./lib/selftest.ps1 *> selftest-output.txt
          $code = $LASTEXITCODE
          Get-Content selftest-output.txt | Write-Host
          # Report both the shell's exit code and the script's own verdict, so a
          # mismatch between 'tests passed' and 'step failed' is immediately visible.
          $verdict = (Get-Content selftest-output.txt | Select-String '结果：' | Select-Object -Last 1).Line
          Write-Host "::notice::LASTEXITCODE=$code ; verdict=$verdict"
          if ($code -ne 0) {
            Write-Host "::error::engine self-test exited $code"
            $tail = (Get-Content selftest-output.txt -Tail 60) -join "`n"
            "## Engine self-test failed (exit $code)`n`n``````n$tail`n``````" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $code
          }
          Write-Host "engine self-test passed"

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-output
          path: selftest-output.txt
          if-no-files-found: warn

      - name: Occluded-capture proof
        shell: pwsh
        # Opens two console windows and maximizes one to guarantee full occlusion.
        # The script terminates the processes it started in every exit path.
        # Note: if the runner cannot host visible windows, the script SKIPs and
        # exits 0 rather than failing — an environment that cannot build the
        # scenario is not evidence of a defect.
        run: |
          ./lib/occlusion-test.ps1 *> occlusion-output.txt
          $code = $LASTEXITCODE
          Get-Content occlusion-output.txt | Write-Host
          # Emit the full output as ::error:: annotations: the Actions log and
          # artifact endpoints both require authentication, but annotations are
          # readable anonymously through the check-runs API. Without this, a
          # runner-only failure of this step cannot be diagnosed at all.
          $lines = Get-Content occlusion-output.txt
          foreach ($l in $lines) {
            if ($l.Trim().Length -gt 0) { Write-Host "::error::$l" }
          }
          if ($code -ne 0) {
            Write-Host "::error::occlusion test exited $code"
            exit $code
          }
          Write-Host "occlusion test passed"

      - name: Upload occlusion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occlusion-output
          path: occlusion-output.txt
          if-no-files-found: warn

      - name: Tool-layer self-test
        shell: pwsh
        # No `$ErrorActionPreference = 'Stop'` here on purpose: these steps invoke
        # native programs (node), and under Stop preference a byte on the child's
        # stderr becomes a terminating error that aborts the step. Exit codes are
        # checked explicitly instead.
        run: |
          node ./lib/selftest.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::tool-layer self-test exited $LASTEXITCODE"; exit $LASTEXITCODE }

      - name: Subprocess-seam contract self-test
        shell: pwsh
        run: |
          node ./lib/selftest-harness.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::seam self-test exited $LASTEXITCODE"; exit $LASTEXITCODE }

      - name: Upload capture evidence
        # The occlusion test's value is partly visual: keep the images so a human
        # can confirm the occluded capture shows the target's own content, not the
        # blocker that covers it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occlusion-evidence
          path: ${{ runner.temp }}/dsh-desktop-hand-occlusion/*.png
          if-no-files-found: warn
